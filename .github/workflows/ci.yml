name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # The frontend's eslint and tsc hooks run from the repository's own
      # node_modules, so they are installed here rather than skipped. Node is
      # a build-time dependency only — nothing in the test job or at run time
      # needs it.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm --prefix frontend ci

      # The frontend's tests run here rather than in the test job, which has
      # no Node. They report no coverage: the Codecov upload below covers
      # pytest alone, and the badge is meant to say that and nothing more.
      - run: npm --prefix frontend test

      # The build output under corpus_query/api/static/ is committed (see the
      # README's "The committed frontend" section) so that running the system
      # needs only Python. Nothing else checks that it still matches the
      # source it was built from, so rebuild it here and fail if the rebuild
      # differs from what is committed, whether that is a changed file, a
      # deleted one, or a new one — that is the only thing that catches a
      # frontend change pushed without its bundle. This depends on Vite's
      # output being reproducible, which has been confirmed in this same
      # Linux container the workflow runs in.
      - run: npm --prefix frontend run build

      - name: Check that the committed frontend bundle is up to date
        run: |
          # git status, not git diff: Vite copies anything added under
          # frontend/public/ into the output unchanged, and a file the
          # rebuild adds that was never committed is untracked, not changed.
          # git diff ignores untracked files entirely, so it would miss that
          # case and pass a stale bundle.
          status=$(git status --porcelain -- corpus_query/api/static)
          if [ -n "$status" ]; then
            echo "::error::corpus_query/api/static is out of date with frontend/. Run 'npm --prefix frontend run build' and commit the result."
            echo "$status"
            git diff --stat -- corpus_query/api/static
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      # no-commit-to-branch guards against committing while main is checked
      # out. CI always has main checked out and is not making a commit, so the
      # hook can only ever fail here. pytest is skipped because this job has no
      # uv and no installed dependencies; the test job below runs it instead.
      - run: pre-commit run --show-diff-on-failure --color=always --all-files
        env:
          SKIP: no-commit-to-branch,pytest

  # Decides whether a pull request touches anything the test suite could
  # possibly care about. It does not run on pushes to main: those always run
  # the suite, because the release workflow runs on main and a release must
  # never be cut from a tree the tests have not seen.
  #
  # What counts as documentation, and so does not run the suite:
  #
  #   - any .md file outside corpus_query/ and data/ — README.md,
  #     CHANGELOG.md, CLAUDE.md, docs/**, .claude/**
  #   - LICENSE
  #
  # Markdown under corpus_query/ and data/ is deliberately excluded from that,
  # because it is input rather than documentation: the prompt templates in
  # corpus_query/*/prompts/ and corpus_query/transcripts/prompt.md are loaded
  # at run time, and data/roster.md, data/topics.md,
  # data/office_files_guidance.md and the transcripts under data/ are read by
  # the code and asserted on by the tests. Everything else — Python,
  # pyproject.toml, uv.lock, this workflow, the pre-commit config — runs the
  # suite.
  #
  # The rule is written as "documentation is a short allowlist" rather than
  # "**.md minus some exceptions" so that a new markdown file added under
  # corpus_query/ or data/ runs the suite by default. Getting that wrong in
  # the safe direction costs a few CI minutes; getting it wrong in the other
  # direction means an untested change.
  #
  # One tradeoff to know about: a job skipped this way reports no conclusion
  # at all. The repository is private, so there is no branch protection and no
  # required status checks, and nothing waits on it. If it ever becomes public
  # with `test` as a required check, a documentation-only pull request would
  # block forever, and the fix is a job that reports success in place of the
  # skipped one.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          is_docs() {
            case "$1" in
              corpus_query/*.md|data/*.md) return 1 ;;
              *.md|LICENSE) return 0 ;;
              *) return 1 ;;
            esac
          }

          code=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if is_docs "$file"; then
              echo "documentation: $file"
            else
              echo "runs the suite: $file"
              code=true
            fi
          done < <(git diff --name-only "$BASE_SHA" HEAD)

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice::test job will run: $code"

  test:
    needs: changes
    # !cancelled() is what lets this run at all on a push to main, where the
    # changes job is skipped: without a status check function here, a skipped
    # dependency skips its dependents too.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      # --locked fails rather than re-resolving, so the tests run against the
      # versions the lock pins and a pyproject.toml edit that was never locked
      # is caught here. The release relocks, so a version bump does not strand
      # the lock a version behind and break the next pull request.
      - run: uv sync --locked

      # -m "not slow" keeps the torch-backed model tests out of CI. They
      # stub the models rather than loading them, but importing the module
      # under test imports torch, and that is the whole expense.
      - run: uv run --frozen pytest -m "not slow" --cov --cov-report=xml

      # fail_ci_if_error is on because a silent upload failure is worse than a
      # red build: the badge and the status checks would go on reporting the
      # last successful run as though it were current.
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
