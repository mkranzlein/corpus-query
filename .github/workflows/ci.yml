name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      # no-commit-to-branch guards against committing while main is checked
      # out. CI always has main checked out and is not making a commit, so the
      # hook can only ever fail here. pytest is skipped because this job has no
      # uv and no installed dependencies; the test job below runs it instead.
      - run: pre-commit run --show-diff-on-failure --color=always --all-files
        env:
          SKIP: no-commit-to-branch,pytest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      # Deliberately not --locked. semantic-release bumps project.version in
      # pyproject.toml without touching uv.lock, so after every release the
      # lock records the previous version and --locked would fail here on the
      # next unrelated pull request. uv sync still installs from the lock.
      - run: uv sync

      - run: uv run pytest
