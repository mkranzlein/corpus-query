name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      # no-commit-to-branch guards against committing while main is checked
      # out. CI always has main checked out and is not making a commit, so the
      # hook can only ever fail here. pytest is skipped because this job has no
      # uv and no installed dependencies; the test job below runs it instead.
      - run: pre-commit run --show-diff-on-failure --color=always --all-files
        env:
          SKIP: no-commit-to-branch,pytest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      # --locked fails rather than re-resolving, so the tests run against the
      # versions the lock pins and a pyproject.toml edit that was never locked
      # is caught here. The release relocks, so a version bump does not strand
      # the lock a version behind and break the next pull request.
      - run: uv sync --locked

      # -m "not slow" keeps the torch-backed model tests out of CI. They
      # stub the models rather than loading them, but importing the module
      # under test imports torch, and that is the whole expense.
      - run: uv run --frozen pytest -m "not slow" --cov --cov-report=xml

      # fail_ci_if_error is on because a silent upload failure is worse than a
      # red build: the badge and the status checks would go on reporting the
      # last successful run as though it were current.
      - uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
