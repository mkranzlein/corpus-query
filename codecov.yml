# https://docs.codecov.com/docs/codecovyml-reference

coverage:
  status:
    # The project as a whole may drift by a point without turning the build
    # red. Anything larger is worth a look, which is what the status is for.
    project:
      default:
        target: auto
        threshold: 1%
    # New and changed lines are held to a fixed bar rather than to the
    # project's current number, so coverage cannot erode a line at a time.
    patch:
      default:
        target: 90%

comment:
  layout: "condensed_header, diff, files"
  require_changes: true

# These two are exercised only by tests marked slow, which CI deselects
# because importing them imports torch. Measuring them here would report a
# number that reflects where the tests run rather than whether they exist —
# they are covered, locally, by the suite that loads the model stack.
ignore:
  - "corpus_query/models/embedder.py"
  - "corpus_query/models/reranker.py"
