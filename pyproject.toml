[project]
name = "corpus-query"
version = "1.1.0"
description = "Corpus query application and its AWS infrastructure."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aws-cdk-lib>=2.170.0",
    "boto3>=1.35.0",
    "constructs>=10.0.0,<11.0.0",
    "openai>=3.16.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["infra", "corpus_query"]
module-root = ""

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
upload_to_vcs_release = false

[tool.semantic_release.branches.main]
match = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]
