[project]
name = "corpus-query"
version = "2.4.0"
description = "Corpus query application and its AWS infrastructure."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic[bedrock]>=1.7.0",
    "aws-cdk-lib>=2.170.0",
    "boto3>=1.35.0",
    "chromadb>=1.5.9",
    "constructs>=10.0.0,<11.0.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

# The model stack is optional at install time. Embedding and reranking need
# it; ingestion, the store, and the vector index do not, and neither does CI,
# which would otherwise install a deep learning stack to run tests that stub
# it. Anything that loads a model needs `uv sync --extra models` first.
# torch is named here as well as reached through sentence-transformers,
# because [tool.uv.sources] below only applies to dependencies declared
# directly.
[project.optional-dependencies]
models = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# torch resolves to the CUDA build on Linux by default, which drags in fifteen
# nvidia-* packages and triton for a project that runs the models on CPU by
# design. Pointing Linux at PyTorch's CPU index keeps the install to what is
# actually used. macOS is left on PyPI, where the wheel is already CPU-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.uv.build-backend]
module-name = ["infra", "corpus_query"]
module-root = ""

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
upload_to_vcs_release = false
# uv.lock records the project's own version, so bumping project.version above
# leaves it stale. Relock and carry the result in the release commit, which
# keeps `uv sync --locked` honest in CI. uv is not in the action's container.
assets = ["uv.lock"]
build_command = "pip install uv && uv lock"

[tool.semantic_release.branches.main]
match = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: pulls in torch through sentence-transformers. Deselected in CI,\n     which has no reason to install a deep learning stack to check that a\n     stub was called with the right arguments.",
]

# Coverage is measured over the application, the infrastructure definitions,
# and the entry points under scripts/, since the tests drive those directly.
# --cov is not in addopts: the local hook runs the suite on every commit and
# there is no reason to pay for measurement there. CI asks for it explicitly.
[tool.coverage.run]
source = ["corpus_query", "infra", "scripts"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
