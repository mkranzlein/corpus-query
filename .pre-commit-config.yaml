# The built frontend under corpus_query/api/static/ is committed on purpose —
# see the README — but it is generated, minified, and not anyone's to edit.
# Whitespace fixers and linters have nothing useful to say about it, and one
# of them rewriting a byte of a bundle would make the commit disagree with
# what Vite produced.
exclude: ^corpus_query/api/static/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
      - id: no-commit-to-branch
        args: [--branch, main]

  # The frontend's own checks. Both need `npm --prefix frontend ci` to have
  # been run, so both are scoped to changes under frontend/ — someone who
  # only ever touches Python is never asked to install Node. Neither one is
  # skipped in CI: the lint job installs the frontend's dependencies so that
  # a lint failure or a type error fails the build there too.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: tsc
        name: tsc
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/
        pass_filenames: false

  # Kept last so the fast checks report first. Skipped in CI's lint job, which
  # has no uv; the test job there runs pytest directly.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --locked pytest -q
        language: system
        types: [python]
        pass_filenames: false
